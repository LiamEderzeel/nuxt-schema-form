name: Release

# trigger by `git tag` push only via `yarn release`
on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # github release + changelog commit
      id-token: write # npm trusted publishing
    steps:
      - name: Checkout codes
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/-1
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build module
        run: pnpm build

      - name: Create github releases
        run: |
          npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Extract version tag
        if: startsWith( github.ref, 'refs/tags/v' )
        uses: jungwinter/split@v2
        id: split
        with:
          msg: ${{ github.ref }}
          separator: '/'

      - name: Update changelog
        run: |
          TAG=${{ steps.split.outputs._2 }}
          # changelogen defaults to the latest tag, which is the new tag itself here; the first release has no previous tag
          FROM=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          pnpm changelog --from="$FROM" --to="$TAG" -r "${TAG#v}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          file_pattern: 'CHANGELOG.md'
          commit_message: 'chore: generate changelog'

      - name: Publish package
        run: ./scripts/release.sh
