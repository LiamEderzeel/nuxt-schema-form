title: 'Runtime Form Generation for Nuxt Applications · @ederzeel/nuxt-form'
description: 'Runtime form generation module for your Nuxt project powered by @nuxt/ui.'
navigation: false
hero:
  description: 'Form module for your Nuxt project powered by @nuxt/ui.'
  orientation: horizontal
  links:
    - label: Get Started
      trailingIcon: 'i-heroicons-arrow-right-20-solid'
      to: '/docs/getting-started'
      size: lg
    - label: Star on GitHub
      icon: i-simple-icons-github
      size: lg
      variant: ghost
      color: gray
      to: https://github.com/liamederzeel/nuxt-schema-form
      target: _blank
  code: |
    ```bash
    npx nuxi@latest module add nuxt-form
    ```

features:
  title: 'Generate a form in seconds!'

  items:
    - title: 'Run time form generation'
      description: 'Powered by json-schema for form generating forms a runtime.'
      icon: 'i-heroicons-cog'

    - title: 'Validation'
      description: 'Validation generated from json schema or with custom functions'
      icon: 'i-heroicons-check'
      to: '/docs/guide'

    - title: 'Search Engine Optimization'
      description: 'Composables to add SEO metadata based on current locale.'
      icon: 'i-heroicons-presentation-chart-line'
      to: '/docs/guide/seo'

  links:
    - label: Get Started
      trailingIcon: 'i-heroicons-arrow-right-20-solid'
      to: '/docs/getting-started'
      size: lg
      color: white
